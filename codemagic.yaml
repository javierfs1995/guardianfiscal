workflows:
  ios-workflow:
    name: iOS Workflow

    instance_type: mac_mini_m2

    max_build_duration: 60

    integrations:
      app_store_connect: ElGuardianFiscal API

    environment:
      node: 22
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.elguardianfiscal.app

    scripts:
      - npm install
      - npx cap sync ios
      - xcode-project use-profiles
      - xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App

    artifacts:
      - build/ios/ipa/*.ipa