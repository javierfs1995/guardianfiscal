workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60

    environment:
      node: 22
      xcode: latest

    scripts:
      - npm install
      - npx cap sync ios
      - xcode-project build-ipa \
          --workspace ios/App/App.xcworkspace \
          --scheme App

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - jfs1995@gmail.com